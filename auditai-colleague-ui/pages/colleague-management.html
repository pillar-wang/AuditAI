/* ============================================================
   AuditAI 同事管理界面 · 轻盈清新风 Design Tokens (精修版)
   brand prefix: audit
   ============================================================ */
:root {
  /* ---- Semantic aliases (head contract) ---- */
  --audit-background: #fafbfc;
  --audit-foreground: #111827;
  --audit-card: #ffffff;
  --audit-card-foreground: #111827;
  --audit-popover: #ffffff;
  --audit-popover-foreground: #111827;
  --audit-primary: #3b82f6;
  --audit-primary-foreground: #ffffff;
  --audit-muted: #f3f4f6;
  --audit-muted-foreground: #6b7280;
  --audit-border: #e5e7eb;
  --audit-input: #d1d5db;
  --audit-ring: #3b82f6;
  --audit-radius-sm: 6px;
  --audit-radius-md: 8px;
  --audit-radius-lg: 12px;

  /* ---- Brand scale (清新蓝) ---- */
  --audit-brand: #3b82f6;
  --audit-brand-hover: #2563eb;
  --audit-brand-active: #1d4ed8;
  --audit-brand-subtle: #eff6ff;
  --audit-brand-border: #bfdbfe;
  --audit-brand-foreground: #ffffff;

  /* ---- State colors (status only) ---- */
  --audit-success: #10b981;
  --audit-success-hover: #059669;
  --audit-success-subtle: #ecfdf5;
  --audit-success-border: #a7f3d0;
  --audit-success-foreground: #065f46;

  --audit-warning: #f59e0b;
  --audit-warning-hover: #d97706;
  --audit-warning-subtle: #fffbeb;
  --audit-warning-border: #fde68a;
  --audit-warning-foreground: #92400e;

  --audit-error: #ef4444;
  --audit-error-hover: #dc2626;
  --audit-error-subtle: #fef2f2;
  --audit-error-border: #fecaca;
  --audit-error-foreground: #991b1b;

  --audit-info: #06b6d4;
  --audit-info-subtle: #ecfeff;
  --audit-info-border: #a5f3fc;
  --audit-info-foreground: #155e75;

  /* ---- Surfaces ---- */
  --audit-surface: #ffffff;
  --audit-surface-muted: #fafbfc;
  --audit-surface-subtle: #f3f4f6;
  --audit-surface-hover: #f9fafb;
  --audit-surface-selected: #eff6ff;

  /* ---- Text ---- */
  --audit-text: #0f172a;
  --audit-text-secondary: #1e293b;
  --audit-text-tertiary: #475569;
  --audit-text-muted: #94a3b8;
  --audit-text-disabled: #cbd5e1;
  --audit-text-on-brand: #ffffff;

  /* ---- Borders ---- */
  --audit-border-subtle: #f3f4f6;
  --audit-border-strong: #d1d5db;

  /* ---- Toolbar (图标在上文字在下) ---- */
  --audit-toolbar-height: 60px;        /* 工具栏高度 60px */
  --audit-toolbar-btn-height: 52px;     /* 按钮高度 52px */
  --audit-toolbar-btn-padding-x: 8px;   /* 水平内边距 */
  --audit-toolbar-btn-padding-y: 6px;   /* 垂直内边距 */
  --audit-toolbar-icon-size: 16px;      /* 图标尺寸 */
  --audit-toolbar-font-size: 11px;      /* 文字大小 11px (≈9pt) */
  --audit-toolbar-gap: 4px;             /* 按钮间距 */
  --audit-toolbar-icon-text-gap: 2px;   /* 图标与文字间距 */

  /* ---- User Card / Tile (精修: 更紧凑) ---- */
  --audit-tile-width: 130px;            /* 原 160px → 精修 130px */
  --audit-tile-height: 110px;           /* 原 140px → 精修 110px */
  --audit-tile-avatar-size: 40px;       /* 头像尺寸 */
  --audit-tile-gap: 12px;               /* 卡片间距 */
  --audit-tile-name-size: 13px;         /* 姓名字号 */
  --audit-tile-username-size: 11px;     /* 用户名字号 */

  /* ---- Sidebar ---- */
  --audit-sidebar-bg: #fafbfc;
  --audit-sidebar-item-hover: #f3f4f6;
  --audit-sidebar-item-active: #eff6ff;
  --audit-sidebar-text: #374151;
  --audit-sidebar-text-active: #1d4ed8;

  /* ---- Typography ---- */
  --audit-font-sans: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --audit-font-mono: "Consolas", "SF Mono", "Cascadia Code", Monaco, "Courier New", monospace;

  --audit-fs-display: 24px;
  --audit-fs-h1: 20px;
  --audit-fs-h2: 16px;
  --audit-fs-h3: 14px;
  --audit-fs-body: 13px;
  --audit-fs-caption: 12px;
  --audit-fs-tiny: 11px;

  --audit-fw-normal: 400;
  --audit-fw-medium: 500;
  --audit-fw-semibold: 600;
  --audit-fw-bold: 700;

  /* ---- Font rendering (sharpness tuning) ---- */
  --audit-font-smoothing: antialiased;
  --audit-text-rendering: optimizeLegibility;

  /* ---- Shadows (static alpha <= 0.05) ---- */
  --audit-shadow-xs: 0 1px 2px 0 rgba(17, 24, 39, 0.04);
  --audit-shadow-sm: 0 1px 3px 0 rgba(17, 24, 39, 0.05), 0 1px 2px -1px rgba(17, 24, 39, 0.03);
  --audit-shadow-float: 0 8px 24px -6px rgba(17, 24, 39, 0.12), 0 2px 6px -2px rgba(17, 24, 39, 0.06);

  /* ---- Layout ---- */
  --audit-sidebar-width: 232px;
  --audit-topbar-height: 56px;
  --audit-statusbar-height: 32px;
  --audit-content-padding: 20px;

  /* ---- Motion ---- */
  --audit-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --audit-dur-fast: 120ms;
  --audit-dur-base: 160ms;
}

    <style>
  /* ===== 设计令牌 ===== */
  :root {
    /* 主色 */
    --color-primary: #3b82f6;
    --color-primary-hover: #2563eb;
    --color-primary-light: #eff6ff;
    --color-primary-lighter: #f0f7ff;

    /* 成功/绿色 */
    --color-success: #22c55e;
    --color-success-hover: #16a34a;
    --color-success-light: #f0fdf4;

    /* 文字 */
    --color-text-primary: #1e293b;
    --color-text-secondary: #64748b;
    --color-text-tertiary: #94a3b8;

    /* 边框 */
    --color-border: #e5e7eb;
    --color-border-light: #f1f5f9;

    /* 背景 */
    --color-bg-toolbar: #fafbfc;
    --color-bg-content: #ffffff;
    --color-bg-window: #ffffff;

    /* 尺寸 - 工具栏 (图标在上文字在下) */
    --toolbar-height: 60px;
    --toolbar-btn-height: 52px;
    --toolbar-btn-padding-x: 8px;
    --toolbar-btn-padding-y: 6px;
    --toolbar-btn-gap: 4px;
    --toolbar-icon-size: 16px;
    --toolbar-font-size: 11px;
    --toolbar-icon-text-gap: 2px;

    /* 尺寸 - 卡片 */
    --card-width: 130px;
    --card-height: 110px;
    --card-gap: 12px;
    --card-avatar-size: 40px;
    --card-radius: 8px;

    /* 圆角 */
    --radius-sm: 4px;
    --radius-md: 6px;
    --radius-lg: 8px;

    /* 阴影 */
    --shadow-window: 0 8px 32px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.08);
    --shadow-card-hover: 0 4px 12px rgba(59, 130, 246, 0.15);

    /* 字体 */
    --font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: var(--font-family);
    background: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  /* ===== 窗口容器 ===== */
  .window {
    width: 900px;
    background: var(--color-bg-window);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-window);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ===== 标题栏 ===== */
  .title-bar {
    height: 32px;
    background: linear-gradient(to bottom, #f8fafc, #f1f5f9);
    border-bottom: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    user-select: none;
    flex-shrink: 0;
  }

  .title-bar-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .window-icon {
    width: 16px;
    height: 16px;
    background: var(--color-primary);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 10px;
    font-weight: bold;
  }

  .window-title {
    font-size: 12px;
    color: var(--color-text-primary);
    font-weight: 500;
  }

  .title-bar-right {
    display: flex;
    align-items: center;
    gap: 0;
  }

  .window-btn {
    width: 46px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
    transition: background 0.15s;
  }

  .window-btn:hover {
    background: #e5e7eb;
  }

  .window-btn.close:hover {
    background: #ef4444;
  }

  .window-btn.close:hover .window-btn-icon {
    stroke: white;
  }

  .window-btn-icon {
    width: 12px;
    height: 12px;
    stroke: var(--color-text-secondary);
    stroke-width: 1.5;
    fill: none;
  }

  /* ===== 工具栏 ===== */
  .toolbar {
    height: var(--toolbar-height);
    background: var(--color-bg-toolbar);
    border-bottom: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: var(--toolbar-btn-gap);
    flex-shrink: 0;
  }

  .toolbar-group {
    display: flex;
    align-items: center;
    gap: var(--toolbar-btn-gap);
  }

  .toolbar-divider {
    width: 1px;
    height: 28px;
    background: var(--color-border);
    margin: 0 4px;
  }

  /* 工具栏按钮 (图标在上 文字在下) */
  .tool-btn {
    height: var(--toolbar-btn-height);
    padding: var(--toolbar-btn-padding-y) var(--toolbar-btn-padding-x);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--toolbar-icon-text-gap);
    background: #ffffff;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
