<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AuditAI 管理后台</title>
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        /* 仪表盘主框架布局：左固定侧边栏 + 右顶部栏 + iframe 内容区 */
        html, body {
            height: 100vh;
            overflow: hidden;
        }

        .dashboard-main {
            margin-left: 220px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .dashboard-main .topbar {
            flex-shrink: 0;
        }

        .iframe-wrap {
            flex: 1;
            margin-left: 0;
            width: auto;
            height: auto;
            background: var(--bg);
            overflow: hidden;
        }

        .iframe-wrap iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .sidebar .sidebar-brand {
            cursor: default;
        }

        .topbar .topbar-user .user-badge {
            background: var(--row-hover);
            color: var(--primary);
            padding: 3px 12px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- 左侧导航栏 -->

        <nav class="nav-list" id="navList">

                <span class="nav-icon"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg></span><span>仪表盘</span>
            </div>
            <div class="nav-item" data-page="/pages/users.html" data-key="users">
                <span class="nav-icon"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><span>用户管理</span>
            </div>
            <div class="nav-item" data-page="/pages/licenses.html" data-key="licenses">
                <span class="nav-icon"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 7.5 19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/></svg></span><span>License 管理</span>

            <div class="nav-item" data-page="/pages/activation-codes.html" data-key="activationCodes">

            </div>

            </div>

    <!-- 右侧主区域 -->
    <div class="dashboard-main">
        <header class="topbar">
            <div class="topbar-title">AuditAI 管理后台</div>
            <div class="topbar-user">
                <span>当前管理员：</span>
                <span class="user-badge" id="adminName">—</span>
                <button class="btn btn-sm" id="changePwdBtn"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6"/><path d="M15.5 7.5l3 3"/></svg>修改密码</button>

        <div class="iframe-wrap">

    <script src="/js/common.js?v=20260703b"></script>
