<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>激活码管理 - AuditAI 管理后台</title>
    <link rel="stylesheet" href="/css/admin.css">
    <!-- 小清新风格字体：Noto Sans SC（SIL OFL 1.1 开源字体），加载失败 fallback 到 Microsoft YaHei -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ===== 激活码管理页：小清新浅蓝风格 + 直接坐标布局 =====
           严格遵守设计要求：
           1. 浅蓝色调（主色 var(--primary)）+ 白色背景 + 圆角控件
           2. 不使用 flexbox/grid 进行布局，全部用 position:absolute + 固定 px 坐标
           3. 字体：Noto Sans SC，fallback Microsoft YaHei / sans-serif
        */

        html, body {
            height: auto;
            min-height: 100%;
        }
        body {
            min-width: 0;
            font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            font-size: 14px;
            line-height: 1.6;
        }

        /* 直接坐标布局容器：承载所有绝对定位的子区块 */
        .ac-page {
            position: relative;
            width: 100%;
            min-height: 600px;
            padding: 0 20px;
        }

        /* ===== 顶部标题区：y=20-70 ===== */
        .ac-title-box {
            position: absolute;
            left: 20px;
            top: 20px;
            width: calc(100% - 40px);
            height: 50px;
        }
        .ac-title-box .ac-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
        }
        .ac-title-box .ac-subtitle {
            font-size: 13px;
            color: var(--text-gray);
            margin-top: 4px;
        }

        /* ===== 通用按钮（小清新浅蓝） ===== */
        .ac-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 38px;
            padding: 0 18px;
            border: 1px solid transparent;
            border-radius: 9px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            transition: background-color .15s ease, border-color .15s ease, opacity .15s ease;
            line-height: 1.4;
            outline: none;
        }
        .ac-btn .icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }
        .ac-btn:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }
        .ac-btn:disabled,
        .ac-btn[disabled] {
            opacity: .6;
            cursor: not-allowed;
        }
        .ac-btn.secondary {
            background: #fff;
            color: var(--text-main);
            border-color: var(--border-strong);
        }
        .ac-btn.secondary:hover {
            background: var(--surface-hover);
            border-color: var(--border-strong);
            color: var(--text-main);
        }

        /* ===== 操作按钮区：y=80-130 ===== */
        .ac-actions {
            position: absolute;
            left: 20px;
            top: 80px;
            width: calc(100% - 40px);
            height: 50px;
        }
        /* 按钮在 .ac-actions 内部使用绝对 left 坐标水平排布 */
        .ac-actions .ac-btn {
            position: absolute;
            top: 0;
        }
        .ac-actions .ac-btn-import    { left: 0; }
        .ac-actions .ac-btn-generate  { left: 130px; }
        .ac-actions .ac-btn-refresh   { left: 260px; }
        .ac-actions .ac-btn-export    { left: 390px; }

        /* ===== 筛选区：y=140-180 ===== */
        .ac-filter {
            position: absolute;
            left: 20px;
            top: 140px;
            width: calc(100% - 40px);
            height: 40px;
        }
        .ac-filter .ac-filter-label {
            position: absolute;
            left: 0;
            top: 9px;
            font-size: 14px;
            color: var(--text-gray);
        }
        .ac-filter .ac-filter-select {
            position: absolute;
            left: 60px;
            top: 0;
            width: 180px;
            height: 38px;
            padding: 0 12px;
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            background: #fff;
            color: var(--text-main);
            outline: none;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .ac-filter .ac-filter-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }
        .ac-filter .ac-filter-tip {
            position: absolute;
            left: 260px;
            top: 9px;
            font-size: 13px;
            color: var(--text-gray);
        }

        /* ===== 列表区：y=190-560 ===== */
        .ac-table-wrap {
            position: absolute;
            left: 20px;
            top: 190px;
            width: calc(100% - 40px);
            height: 370px;
            overflow: auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px var(--shadow);
        }
        table.ac-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        table.ac-table th,
        table.ac-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-light);
            white-space: nowrap;
        }
        table.ac-table th {
            background: var(--surface-hover);
            color: var(--text-gray);
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        table.ac-table tbody tr:nth-child(even) { background: var(--zebra); }
        table.ac-table tbody tr:hover { background: var(--row-hover); }
        table.ac-table tbody tr:last-child td { border-bottom: none; }

        .ac-code-text {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            color: var(--text-main);
            letter-spacing: 0.3px;
        }
        .ac-empty-row td {
            text-align: center;
            padding: 40px;
            color: var(--text-gray);
        }

        /* 行内操作按钮：使用 inline-block + margin 排布，未使用 flex/grid */
        .ac-row-actions {
            display: inline-block;
            white-space: nowrap;
        }
        .ac-row-actions button {
            margin-right: 4px;
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-strong);
            background: #fff;
            color: var(--text-main);
            cursor: pointer;
            font-family: inherit;
            transition: background-color .15s ease;
        }
        .ac-row-actions button:hover:not(:disabled) { background: var(--surface-hover); }
        .ac-row-actions button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }
        .ac-row-actions button.danger {
            background: var(--error);
            color: #fff;
            border-color: var(--error);
        }
        .ac-row-actions button.danger:hover:not(:disabled) {
            background: var(--error-hover);
            border-color: var(--error-hover);
        }

        /* ===== 状态徽章：0=未使用（绿） / 1=已使用（灰） / 2=已禁用（红） ===== */
        .ac-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            line-height: 1.6;
            color: #fff;
            white-space: nowrap;
        }
        .ac-badge.unused   { background: var(--success); } /* 未使用 - 绿色 */
        .ac-badge.used     { background: var(--text-light); } /* 已使用 - 灰色 */
        .ac-badge.disabled { background: var(--error); } /* 已禁用 - 红色 */

        /* ===== 弹窗（div + position:fixed 实现，不使用 alert/prompt） ===== */
        .ac-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 9000;
            animation: ac-fade-in .15s ease;
        }
        .ac-modal-card {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 32px var(--shadow-lg);
            width: 460px;
            max-width: calc(100vw - 40px);
            max-height: calc(100vh - 60px);
            display: flex;
            flex-direction: column;
            z-index: 9001;
            animation: ac-modal-pop .2s ease;
        }
        .ac-modal-card.wide { width: 560px; }

        .ac-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
        }
        .ac-modal-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
        }
        .ac-modal-close {
            background: transparent;
            border: none;
            font-size: 24px;
            color: var(--text-gray);
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }
        .ac-modal-close:hover {
            color: var(--text-main);
        }
        .ac-modal-body {
            padding: 20px;
            color: var(--text-gray);
            line-height: 1.6;
            overflow-y: auto;
            flex: 1;
        }
        .ac-modal-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border-light);
            text-align: right;
            flex-shrink: 0;
        }
        .ac-modal-footer button {
            margin-left: 8px;
        }

        .ac-form-group {
            margin-bottom: 16px;
        }
        .ac-form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-gray);
            font-size: 13px;
        }
        .ac-textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            font-size: 13px;
            font-family: 'Consolas', 'Monaco', monospace;
            background: #fff;
            color: var(--text-main);
            outline: none;
            min-height: 180px;
            resize: vertical;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .ac-textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }
        .ac-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            background: #fff;
            color: var(--text-main);
            outline: none;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .ac-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        /* 生成结果展示：可滚动、可复制 */
        .ac-gen-result {
            margin-top: 8px;
            padding: 12px;
            background: var(--surface-hover);
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            color: var(--text-main);
            white-space: pre;
            max-height: 240px;
            overflow: auto;
            user-select: text;
        }
        .ac-gen-meta {
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-gray);
        }

        @keyframes ac-fade-in {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        @keyframes ac-modal-pop {
            from { transform: translate(-50%, -50%) scale(0.96); opacity: 0; }
            to   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- 直接坐标布局：所有区块使用 position:absolute + 固定 px 坐标 -->
    <div class="ac-page">
        <!-- 顶部标题区 y=20-70 -->
        <div class="ac-title-box">
            <div class="ac-title">激活码管理</div>
            <div class="ac-subtitle">批量导入、生成、查询、禁用与删除激活码</div>
        </div>

        <!-- 操作按钮区 y=80-130：[批量导入] [批量生成] [刷新列表] [导出CSV] -->
        <div class="ac-actions">
            <button class="ac-btn ac-btn-import" id="btnImport"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>批量导入</button>
            <button class="ac-btn ac-btn-generate" id="btnGenerate"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063L6.1 13.5l2.4-.563A2 2 0 0 0 9.937 11.5L10.5 9.1l.563 2.4A2 2 0 0 0 12.5 12.937l2.4.563-2.4.563a2 2 0 0 0-1.437 1.437L10.5 17.5z"/><path d="M14.5 19.5 15 21l.5 1.5L16 21l1.5-.5L16 20l-.5-1.5L15 20z"/></svg>批量生成</button>
            <button class="ac-btn secondary ac-btn-refresh" id="btnRefresh"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>刷新列表</button>
            <button class="ac-btn secondary ac-btn-export" id="btnExport"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>导出CSV</button>
        </div>

        <!-- 筛选区 y=140-180：状态下拉框 -->
        <div class="ac-filter">
            <span class="ac-filter-label">状态：</span>
            <select class="ac-filter-select" id="statusFilter">
                <option value="">全部</option>
                <option value="0">未使用</option>
                <option value="1">已使用</option>
                <option value="2">已禁用</option>
            </select>
            <span class="ac-filter-tip" id="filterTip"></span>
        </div>

        <!-- 列表区 y=190-560：表格 -->
        <div class="ac-table-wrap">
            <table class="ac-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>激活码</th>
                        <th>状态</th>
                        <th>使用人ID</th>
                        <th>设备码</th>
                        <th>使用时间</th>
                        <th>批次</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="codesTableBody">
                    <tr class="ac-empty-row"><td colspan="9">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="/js/common.js?v=20260703b"></script>
    <script src="/js/activation-codes.js"></script>
</body>
</html>
