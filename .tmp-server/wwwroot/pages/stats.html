<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 - AuditAI 管理后台</title>
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        /* 页面专属样式：固定 4 列统计卡片 + 紫色变体 */
        .stat-grid {
            grid-template-columns: repeat(4, 1fr);
        }

        .stat-card.purple {
            border-left-color: var(--purple);
        }

        .stat-card .stat-warn {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--error);
            margin-top: 2px;
            font-weight: 500;
        }

        .stat-card .stat-warn .icon {
            width: 14px;
            height: 14px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .empty-row td {
            text-align: center;
            color: var(--text-gray);
            padding: 32px 16px;
        }

        table.table td code {
            font-family: 'Consolas', 'Microsoft YaHei', monospace;
            font-size: 13px;
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <div class="content-body">
        <div class="page-header">
            <div class="page-title">仪表盘</div>
        </div>

        <!-- 统计卡片网格 -->
        <div class="stat-grid" id="statGrid">
            <!-- 由 stats.js 渲染 -->
        </div>

        <!-- 即将到期的 License -->
        <div class="card mt-16">
            <div class="section-title">即将到期的 License（30天内）</div>
            <div class="table-wrap">
                <table class="table">
                    <thead>
                        <tr>
                            <th>License Key</th>
                            <th>团队名</th>
                            <th>套餐</th>
                            <th>座位数</th>
                            <th>到期日期</th>
                            <th>剩余天数</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody id="licenseTbody">
                        <tr class="empty-row"><td colspan="7">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/common.js?v=20260703b"></script>
    <script src="/js/stats.js"></script>
</body>
</html>
